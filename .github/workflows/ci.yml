name: Plugin Template CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: template-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Pack plugin
        run: |
          mkdir -p dist
          npm pack --pack-destination dist

      - name: Verify package
        run: test -n "$(ls dist/*.tgz)"
